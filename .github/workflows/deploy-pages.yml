name: Deploy to GitHub Pages

# Builds the static site and publishes it to the `gh-pages` branch.
# GitHub Pages serves that branch at https://dineshs7207-glitch.github.io/BetweenUs/
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / root).

on:
  push:
    branches: [claude/loving-mccarthy-tw913v, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download dish photos and drink cut-outs (Higgsfield)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm run photos

      - name: Save new photos to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/menu public/drinks
          if ! git diff --cached --quiet; then
            git commit -qm "Add dish photos from Higgsfield"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /BetweenUs
          NEXT_PUBLIC_SITE_URL: https://dineshs7207-glitch.github.io/BetweenUs/
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Publish to gh-pages branch
        run: |
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
